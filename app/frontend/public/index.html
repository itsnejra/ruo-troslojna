<!doctype html>
<html lang="bs">
<head>

  <title>Bilješke</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Bilješke</h1>
      <p class="sub">Troslojna aplikacija kao kod · frontend → backend → baza</p>

    <p id="greska" class="greska" hidden></p>

    <ul id="lista"></ul>

  <script src="/app.js" defer></script>

</html>
