# Zajedničko za sve VM-ove. Obrazac iz s3/p3: VM dobije adresu prije nego cloud-init završi,
# pa se prvo čeka, inače bi prvo izvršavanje nasumično padalo.
- name: Čekaj da SSH postane dostupan
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Čekaj da cloud-init završi
  ansible.builtin.command: cloud-init status --wait
  register: common_ci
  changed_when: false
  # 0 = gotovo; 2 = gotovo uz upozorenja (cloud-init >= 23), što nije greška za nas
  failed_when: common_ci.rc not in [0, 2]

- name: Prikupi činjenice
  ansible.builtin.setup:

- name: Direktorij konfiguracije projekta
  ansible.builtin.file:
    path: /etc/ruo
    state: directory
    owner: root
    group: root
    mode: "0755"
