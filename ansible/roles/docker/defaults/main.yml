# Docker na VM-ovima (DO-2): kontejneri koriste mrežu VM-a (network_mode: host), pa Docker ne treba
# ni bridge ni iptables. Time je nftables VM-a jedini vatrozid i nema DNAT-a koji bi ga zaobišao.
docker_daemon:
  iptables: false
  ip6tables: false
  ip-forward: false
  bridge: none
  live-restore: true            # restart dockerd ne gasi kontejnere
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"
