# make config: osnovna konfiguracija infrastrukture (AO-5). Idempotentno: drugo izvršavanje changed=0.
# Isporuka aplikacije je zasebno (deploy.yml), jer zavisi i od DNS zapisa (make dns).
# Sve što mijenja servere je u rolama; u playbooku je samo čekanje da VM-ovi budu spremni.

- name: Ruter i namespace klijenta (host)
  hosts: hypervisor
  become: true            # traži sudo lozinku hosta: make config pokreće ansible-playbook -K
  gather_facts: false
  roles: [router]

- name: Vatrozid svih VM-ova
  hosts: vms
  become: true
  gather_facts: false     # činjenice se skupljaju tek kad VM odgovara i cloud-init završi

  # Obrazac iz s3/p3: VM dobije adresu prije nego cloud-init završi, pa se prvo čeka,
  # inače bi prvo izvršavanje nasumično padalo. Ovi koraci ništa ne mijenjaju na serveru.
  pre_tasks:
    - name: Čekaj da SSH postane dostupan
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Čekaj da cloud-init završi
      ansible.builtin.command: cloud-init status --wait
      register: vm_ci
      changed_when: false
      # 0 = gotovo; 2 = gotovo uz upozorenja (cloud-init >= 23), što nije greška za nas
      failed_when: vm_ci.rc not in [0, 2]

    - name: Prikupi činjenice
      ansible.builtin.setup:

  roles: [firewall]

- name: Docker na VM-ovima aplikacije
  hosts: web:app:db
  become: true
  gather_facts: false
  roles: [docker]

- name: Autoritativni DNS
  hosts: infra
  become: true
  gather_facts: false
  roles: [bind]
