# make config: osnovna konfiguracija infrastrukture (AO-5). Idempotentno: drugo izvršavanje changed=0.
# Isporuka aplikacije je zasebno (deploy.yml), jer zavisi i od DNS zapisa (make dns).
# Role su samo za veće cjeline (router, firewall, bind, app); kratki koraci su ovdje, u playbooku.

- name: Ruter i namespace klijenta (host)
  hosts: hypervisor
  become: true            # traži sudo lozinku hosta: make config pokreće ansible-playbook -K
  gather_facts: false
  roles: [router]

- name: Osnova i vatrozid svih VM-ova
  hosts: vms
  become: true
  gather_facts: false     # činjenice se skupljaju tek kad VM odgovara i cloud-init završi

  # Obrazac iz s3/p3: VM dobije adresu prije nego cloud-init završi, pa se prvo čeka,
  # inače bi prvo izvršavanje nasumično padalo.
  pre_tasks:
    - name: Čekaj da SSH postane dostupan
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Čekaj da cloud-init završi
      ansible.builtin.command: cloud-init status --wait
      register: vm_ci
      changed_when: false
      # 0 = gotovo; 2 = gotovo uz upozorenja (cloud-init >= 23), što nije greška za nas
      failed_when: vm_ci.rc not in [0, 2]

    - name: Prikupi činjenice
      ansible.builtin.setup:

    - name: Direktorij konfiguracije projekta
      ansible.builtin.file:
        path: /etc/ruo
        state: directory
        owner: root
        group: root
        mode: "0755"

  roles: [firewall]

# Docker je u zlatnoj slici, ali isključen (DO-4): ovdje dobija konfiguraciju i tek onda se pokreće,
# pa nikad ne radi sa zadanim postavkama (bridge + iptables).
- name: Docker na VM-ovima aplikacije
  hosts: web:app:db
  become: true
  gather_facts: false

  vars:
    # Kontejneri koriste mrežu VM-a (network_mode: host, DO-2), pa Docker ne treba ni bridge ni
    # iptables. Time je nftables VM-a jedini vatrozid i nema DNAT-a koji bi ga zaobišao.
    docker_daemon:
      iptables: false
      ip6tables: false
      ip-forward: false
      bridge: none
      live-restore: true            # restart dockerd ne gasi kontejnere
      log-driver: json-file
      log-opts:
        max-size: "10m"
        max-file: "3"

  tasks:
    - name: Konfiguracija Docker daemona
      ansible.builtin.copy:
        content: "{{ docker_daemon | to_nice_json }}\n"
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      notify: Restartuj docker

    - name: Docker radi i pokreće se s VM-om
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

  handlers:
    - name: Restartuj docker
      ansible.builtin.service:
        name: docker
        state: restarted

- name: Autoritativni DNS
  hosts: infra
  become: true
  gather_facts: false
  roles: [bind]
