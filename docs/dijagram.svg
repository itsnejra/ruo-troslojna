<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="zel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="pla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="siv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
  </defs>

  <rect width="1400" height="860" fill="#ffffff"/>

  <!-- HOST -->
  <rect x="15" y="15" width="1370" height="830" rx="14" fill="#f7f9fc" stroke="#1f4e79" stroke-width="2"/>
  <text x="35" y="45" font-size="20" font-weight="700" fill="#1f4e79">Laptop: Windows 11 → WSL2 Ubuntu (host)</text>
  <text x="35" y="68" font-size="14" fill="#444">hipervizor KVM/libvirt · ruter između segmenata · kontrolni čvor (make, Packer, Terraform, Ansible, Docker)</text>

  <!-- INTERNET (namespace) -->
  <rect x="45" y="95" width="270" height="92" rx="10" fill="#fff4e5" stroke="#e08a00" stroke-width="2"/>
  <text x="180" y="122" font-size="16" font-weight="700" fill="#a15c00" text-anchor="middle">„Internet"</text>
  <text x="180" y="144" font-size="13" fill="#333" text-anchor="middle">namespace ruo-klijent</text>
  <text x="180" y="166" font-size="13" fill="#333" text-anchor="middle">10.20.255.2 (/30)</text>

  <!-- veth -->
  <line x1="315" y1="141" x2="470" y2="141" stroke="#e08a00" stroke-width="3"/>
  <text x="392" y="132" font-size="12" fill="#a15c00" text-anchor="middle">veth</text>
  <text x="392" y="160" font-size="12" fill="#a15c00" text-anchor="middle">host .255.1</text>

  <!-- RUTER -->
  <rect x="470" y="88" width="460" height="108" rx="10" fill="#1f4e79"/>
  <text x="700" y="116" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">RUTER (host) · nftables tabela inet ruo3t</text>
  <text x="700" y="140" font-size="13.5" fill="#dce8f5" text-anchor="middle">ip_forward = 1 · mode = route (bez NAT-a, bez DHCP-a)</text>
  <text x="700" y="162" font-size="13.5" fill="#dce8f5" text-anchor="middle">default deny za promet projektnih sučelja</text>
  <text x="700" y="184" font-size="13.5" fill="#dce8f5" text-anchor="middle">pravila iz mreza_politika (4 reda)</text>

  <!-- bez interneta -->
  <rect x="970" y="100" width="380" height="84" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
  <text x="1160" y="128" font-size="14.5" font-weight="700" fill="#b3261e" text-anchor="middle">Segmenti nemaju izlaz na internet</text>
  <text x="1160" y="150" font-size="12.5" fill="#333" text-anchor="middle">paketi su u Packer slici,</text>
  <text x="1160" y="168" font-size="12.5" fill="#333" text-anchor="middle">slike kontejnera stižu kao arhive s hosta</text>

  <!-- veze ruter → segmenti (bridge-ovi) -->
  <g stroke="#1f4e79" stroke-width="2.5" fill="none">
    <path d="M 560 196 L 560 225 L 195 225 L 195 262"/>
    <path d="M 650 196 L 650 240 L 530 240 L 530 262"/>
    <path d="M 750 196 L 750 240 L 870 240 L 870 262"/>
    <path d="M 840 196 L 840 225 L 1205 225 L 1205 262"/>
  </g>
  <g font-size="12.5" fill="#1f4e79" font-weight="600">
    <text x="203" y="252">10.20.0.1</text>
    <text x="538" y="257">10.20.1.1</text>
    <text x="878" y="257">10.20.2.1</text>
    <text x="1213" y="252">10.20.3.1</text>
  </g>

  <!-- SEGMENTI -->
  <g stroke-dasharray="7 5" stroke-width="1.8" fill="#ffffff">
    <rect x="45"   y="262" width="300" height="420" rx="10" stroke="#607d8b"/>
    <rect x="380"  y="262" width="300" height="420" rx="10" stroke="#607d8b"/>
    <rect x="720"  y="262" width="300" height="420" rx="10" stroke="#607d8b"/>
    <rect x="1055" y="262" width="300" height="420" rx="10" stroke="#607d8b"/>
  </g>
  <g font-size="15" font-weight="700" fill="#37474f" text-anchor="middle">
    <text x="195"  y="288">segment infra · ruo-infra</text>
    <text x="530"  y="288">segment web · ruo-web</text>
    <text x="870"  y="288">segment app · ruo-app</text>
    <text x="1205" y="288">segment db · ruo-db</text>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="195"  y="308">10.20.0.0/24</text>
    <text x="530"  y="308">10.20.1.0/24</text>
    <text x="870"  y="308">10.20.2.0/24</text>
    <text x="1205" y="308">10.20.3.0/24</text>
  </g>

  <!-- VM-ovi -->
  <g>
    <!-- ns1 -->
    <rect x="70" y="390" width="250" height="190" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="195" y="418" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">ns1 · 10.20.0.53</text>
    <rect x="90" y="432" width="210" height="58" rx="6" fill="#ffffff" stroke="#90caf9"/>
    <text x="195" y="456" font-size="14" font-weight="600" fill="#222" text-anchor="middle">BIND 9 (DNS)</text>
    <text x="195" y="477" font-size="12.5" fill="#444" text-anchor="middle">zona ruo.internal + reverzna</text>
    <text x="195" y="512" font-size="12.5" fill="#444" text-anchor="middle">samo autoritativan</text>
    <text x="195" y="531" font-size="12.5" fill="#444" text-anchor="middle">(tuđe domene: REFUSED)</text>
    <text x="195" y="565" font-size="11.5" fill="#666" text-anchor="middle">nftables: input drop</text>

    <!-- web1 -->
    <rect x="405" y="390" width="250" height="190" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="530" y="418" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">web1 · 10.20.1.10</text>
    <rect x="425" y="432" width="210" height="58" rx="6" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="530" y="456" font-size="14" font-weight="600" fill="#222" text-anchor="middle">kontejner frontend</text>
    <text x="530" y="477" font-size="12.5" fill="#444" text-anchor="middle">nginx :80 (stranica + /api/)</text>
    <text x="530" y="512" font-size="12.5" fill="#444" text-anchor="middle">jedini ulaz izvana</text>
    <text x="530" y="531" font-size="12.5" fill="#444" text-anchor="middle">nema nijednu tajnu</text>
    <text x="530" y="565" font-size="11.5" fill="#666" text-anchor="middle">nftables: input drop · network_mode: host</text>

    <!-- app1 -->
    <rect x="745" y="390" width="250" height="190" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="870" y="418" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">app1 · 10.20.2.10</text>
    <rect x="765" y="432" width="210" height="58" rx="6" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="870" y="456" font-size="14" font-weight="600" fill="#222" text-anchor="middle">kontejner backend</text>
    <text x="870" y="477" font-size="12.5" fill="#444" text-anchor="middle">FastAPI :8000</text>
    <text x="870" y="512" font-size="12.5" fill="#444" text-anchor="middle">lozinka baze: fajl 0400</text>
    <text x="870" y="531" font-size="12.5" fill="#444" text-anchor="middle">bazu traži kao db.ruo.internal</text>
    <text x="870" y="565" font-size="11.5" fill="#666" text-anchor="middle">nftables: input drop · network_mode: host</text>

    <!-- db1 -->
    <rect x="1080" y="390" width="250" height="190" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1205" y="418" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">db1 · 10.20.3.10</text>
    <rect x="1100" y="432" width="210" height="58" rx="6" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="1205" y="456" font-size="14" font-weight="600" fill="#222" text-anchor="middle">kontejner baza</text>
    <text x="1205" y="477" font-size="12.5" fill="#444" text-anchor="middle">PostgreSQL :5432, bez porta</text>
    <text x="1205" y="512" font-size="12.5" fill="#444" text-anchor="middle">pg_hba: samo app mreža</text>
    <text x="1205" y="531" font-size="12.5" fill="#444" text-anchor="middle">povjerljive bilješke (Trezor)</text>
    <text x="1205" y="565" font-size="11.5" fill="#666" text-anchor="middle">nftables: input drop · network_mode: host</text>
  </g>

  <!-- disk za podatke -->
  <rect x="1115" y="605" width="180" height="58" rx="8" fill="#fffde7" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="1205" y="629" font-size="13" font-weight="700" fill="#6b5400" text-anchor="middle">disk vdb (5 GB)</text>
  <text x="1205" y="649" font-size="12" fill="#444" text-anchor="middle">→ /srv/pgdata (AO-10)</text>
  <line x1="1205" y1="580" x2="1205" y2="605" stroke="#8a6d00" stroke-width="2"/>

  <!-- DOZVOLJENI TOKOVI -->
  <!-- internet -> web1 :80 -->
  <path d="M 300 187 C 362 205, 362 260, 362 320 C 362 365, 395 380, 440 388" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#zel)"/>
  <rect x="392" y="326" width="74" height="22" rx="4" fill="#2e7d32"/>
  <text x="429" y="342" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">tcp 80</text>

  <!-- web1 -> app1 :8000 -->
  <line x1="655" y1="455" x2="743" y2="455" stroke="#2e7d32" stroke-width="3" marker-end="url(#zel)"/>
  <rect x="663" y="461" width="72" height="22" rx="4" fill="#2e7d32"/>
  <text x="699" y="477" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">tcp 8000</text>

  <!-- app1 -> db1 :5432 -->
  <line x1="995" y1="455" x2="1078" y2="455" stroke="#2e7d32" stroke-width="3" marker-end="url(#zel)"/>
  <rect x="1001" y="461" width="72" height="22" rx="4" fill="#2e7d32"/>
  <text x="1037" y="477" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">tcp 5432</text>

  <!-- BLOKIRANO web1 -> db1 -->
  <path d="M 560 390 C 620 330, 1110 330, 1170 388" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
  <circle cx="865" cy="344" r="15" fill="#b3261e"/>
  <text x="865" y="350" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✕</text>
  <text x="865" y="378" font-size="13" font-weight="700" fill="#b3261e" text-anchor="middle">web1 → db1 blokirano</text>

  <!-- DNS :53 (svi -> ns1) -->
  <path d="M 530 580 C 530 640, 260 650, 220 582" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#pla)"/>
  <path d="M 870 580 C 870 680, 290 690, 195 582" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#pla)"/>
  <path d="M 1095 580 C 1060 720, 270 725, 170 582" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#pla)"/>
  <rect x="455" y="668" width="200" height="22" rx="4" fill="#1565c0"/>
  <text x="555" y="684" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">DNS udp/tcp 53 (svi → ns1)</text>

  <!-- LEGENDA -->
  <g font-size="13.5" fill="#333">
    <line x1="45" y1="745" x2="95" y2="745" stroke="#2e7d32" stroke-width="3" marker-end="url(#zel)"/>
    <text x="105" y="750">dozvoljeno (smjer uspostave veze; odgovori prolaze sami)</text>
    <line x1="45" y1="773" x2="95" y2="773" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="105" y="778">sve ostalo je blokirano (default deny): web → db, internet → app/db, izlaz van</text>
    <line x1="45" y1="801" x2="95" y2="801" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pla)"/>
    <text x="105" y="806">DNS: slojevi se nalaze po imenu (backend.ruo.internal, db.ruo.internal)</text>
    <text x="45" y="834" fill="#555">Sav promet između segmenata fizički prolazi kroz ruter (host). Zaštita na tri nivoa: ruter · vatrozid VM-a · pg_hba.conf. Upravljanje: host → VM-ovi :22, samo ključem.</text>
  </g>
</svg>
